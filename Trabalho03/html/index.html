<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container">
        <form class="formulario" action="#" method="post">
            <div class="row g-3">
                <div class="col-12 col-md-6">
                    <label for="nome" class="form-label">Nome Fantasia ou primeiro nome</label>
                    <input type="text" class="form-control" id="nome" name="nome">
                </div>

                <div class="col-12 col-md-6">
                    <label class="form-label d-block">Pessoa</label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="pessoa" id="fisica" value="fisica">
                        <label class="form-check-label" for="fisica">Física</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="pessoa" id="juridica" value="juridica">
                        <label class="form-check-label" for="juridica">Jurídica</label>
                    </div>
                </div>

                <div class="col-12 col-md-8">
                    <label for="razao" class="form-label">Razão</label>
                    <input type="text" class="form-control" id="razao" name="razao">
                </div>

                <div class="col-12 col-md-4">
                    <label for="cnpj" class="form-label">CNPJ</label>
                    <input type="text" class="form-control" id="cnpj" name="cnpj" placeholder="00.000.000/0000-00">
                </div>

                <div class="col-12 col-md-8">
                    <label for="endereco" class="form-label">Endereço</label>
                    <input type="text" class="form-control" id="endereco" name="endereco">
                </div>

                <div class="col-12 col-md-4">
                    <label for="bairro" class="form-label">Bairro</label>
                    <input type="text" class="form-control" id="bairro" name="bairro">
                </div>

                <div class="col-12 col-md-6">
                    <label for="cidade" class="form-label">Cidade</label>
                    <input type="text" class="form-control" id="cidade" name="cidade">
                </div>

                <div class="col-12 col-md-3">
                    <label for="estado" class="form-label">Estado</label>
                    <select class="form-select" id="estado" name="estado">
                        <option value="MG" selected>Minas Gerais</option>
                    </select>
                </div>

                <div class="col-12 col-md-3">
                    <label for="cep" class="form-label">CEP</label>
                    <input type="text" class="form-control" id="cep" name="cep" placeholder="00000-000">
                </div>

                <div class="col-12 col-md-4">
                    <label for="telefone" class="form-label">Telefone</label>
                    <input type="tel" class="form-control" id="telefone" name="telefone">
                </div>

                <div class="col-12 col-md-4">
                    <label for="celular" class="form-label">Celular</label>
                    <input type="tel" class="form-control" id="celular" name="celular">
                </div>

                <div class="col-12 col-md-4">
                    <label for="fax" class="form-label">Fax</label>
                    <input type="tel" class="form-control" id="fax" name="fax">
                </div>

                <div class="col-12 col-md-6">
                    <label for="contato" class="form-label">Contato</label>
                    <input type="text" class="form-control" id="contato" name="contato">
                </div>

                <div class="col-12 col-md-6">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="email" name="email">
                </div>

                <div class="col-12">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="avisos" name="avisos" checked>
                        <label class="form-check-label" for="avisos">Receber e-mails de aviso sobre novas licitações</label>
                    </div>
                </div>

                <div class="col-12 tipo-empresa">
                    <label class="form-label d-block">Tipo de empresa</label>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="tipoEmpresa" id="micro" value="micro">
                        <label class="form-check-label" for="micro">MICRO EMPRESAS / EMPRESAS DE PEQUENO PORTE</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="tipoEmpresa" id="demais" value="demais">
                        <label class="form-check-label" for="demais">DEMAIS FORMAS DE CONSTITUIÇÃO</label>
                    </div>
                </div>

                <div class="col-12 text-end mt-3">
                    <button type="submit" class="btn btn-primary">Salvar cadastro</button>
                </div>
            </div>

            <p class="aviso">ATENÇÃO: Este cadastro não substitui o cadastro de fornecedores do município de São Sebastião do Paraíso</p>
        </form>
    </main>
</body>
</html>
