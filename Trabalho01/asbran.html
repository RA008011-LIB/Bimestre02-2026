<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ASBRAN | Título de Especialista</title>
  <link href="css/bootstrap.min.css" rel="stylesheet">
  <link href="css/estilo.css" rel="stylesheet">
</head>
<body>
  <main class="container secao-asbran">
    <div class="row justify-content-center align-items-center">
      <section class="col-12 col-lg-10 asbran-wrap">
        <div class="row align-items-center g-4">
          <div class="col-12 col-md-6">
            <p class="asbran-kicker">Especialista em Nutrição</p>
            <h1 class="asbran-title">O maior reconhecimento na carreira profissional</h1>
            <p class="asbran-copy">
              O Título de Especialista é o reconhecimento da capacitação técnica e
              científica no desempenho das especialidades profissionais. A certificação
              valoriza a formação e a atuação de profissionais da Nutrição.
            </p>
          </div>
          <div class="col-12 col-md-6">
            <img class="certificado"
              src="https://www.asbran.org.br/themes/asbran/assets/images/arteTOPOtitulo.png"
              alt="Arte oficial do Título de Especialista da ASBRAN">
          </div>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
